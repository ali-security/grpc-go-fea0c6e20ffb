name: Testing

# Trigger on pushes, PRs (excluding documentation changes), and nightly.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Comma-separated test names to run (empty = full suite)'
        required: false
        default: ''

permissions:
  contents: read

# Always force the use of Go modules
env:
  GO111MODULE: on

jobs:
  # Check generated protos match their source repos (optional for PRs).
  vet-proto:
    # disabled on the seal fork: vet.sh -install fetches today's linters, which no longer build on Go 1.15
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Setup the environment.
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.15
      - name: Checkout repo
        uses: actions/checkout@v2

      # Run the vet checks.
      - name: vet
        run: ./vet.sh -install && ./vet.sh

  # Run the main gRPC-Go tests.
  # Build the module zip (the artifact proxy.golang.org serves) on the seal fork.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.17

      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Create module zip
        run: |
          cp -r "${GITHUB_WORKSPACE}" /tmp/modsrc
          rm -rf /tmp/modsrc/.git
          mkdir -p /tmp/ziphelper /tmp/out
          cd /tmp/ziphelper
          go mod init ziphelper
          cat > main.go <<'EOF'
          package main

          import (
                  "os"

                  "golang.org/x/mod/module"
                  "golang.org/x/mod/zip"
          )

          func main() {
                  f, err := os.Create(os.Args[3])
                  if err != nil {
                      panic(err)
                  }
                  defer f.Close()
                  if err := zip.CreateFromDir(f, module.Version{Path: os.Args[1], Version: os.Args[2]}, os.Args[4]); err != nil {
                      panic(err)
                  }
          }
          EOF
          go get golang.org/x/mod@v0.8.0
          go run . google.golang.org/grpc v1.43.0 /tmp/out/v1.43.0.zip /tmp/modsrc
          ls -l /tmp/out

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: /tmp/out/v1.43.0.zip
          if-no-files-found: error

  tests:
    # Proto checks are run in the above job.
    env:
      VET_SKIP_PROTO: 1
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: vet+tests
            goversion: 1.17

          - type: tests
            goversion: 1.17
            testflags: -race

          - type: extras
            goversion: 1.17

          - type: tests
            goversion: 1.17
            goarch: 386

          - type: tests
            goversion: 1.17
            goarch: arm64

          - type: tests
            goversion: 1.16

          - type: tests
            goversion: 1.15

          # Windows leg added on the seal fork (required OS coverage).
          # Go 1.18: Go 1.17 x509.SystemCertPool() is unimplemented on Windows.
          # x509sha1=1: the repo's test certs are SHA1-signed, rejected by default since Go 1.18.
          # 20m: the test package exceeds 7m on Windows runners.
          - type: tests
            goversion: 1.18
            runner: windows-latest
            grpcenv: GODEBUG=x509sha1=1
            gotimeout: 20m

    steps:
      # Setup the environment.
      - name: Setup GOARCH
        if: matrix.goarch != ''
        run: echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV

      - name: Setup qemu emulator
        if: matrix.goarch == 'arm64'
        # setup qemu-user-static emulator and register it with binfmt_misc so that aarch64 binaries
        # are automatically executed using qemu.
        run: docker run --rm --privileged multiarch/qemu-user-static:5.2.0-2 --reset --credential yes --persistent yes

      # Old (Go <=1.17) TSAN cannot map memory with the 32-bit ASLR entropy of current ubuntu runners.
      - name: Lower ASLR entropy for the race detector
        if: matrix.testflags == '-race'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Setup GRPC environment
        if: matrix.grpcenv != ''
        run: echo "${{ matrix.grpcenv }}" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.goversion }}

      - name: Checkout repo
        uses: actions/checkout@v2

      # Only run vet for 'vet' runs.
      - name: Run vet.sh
        # disabled on the seal fork: lint gate; vet.sh -install fetches today's linters
        if: false
        run: ./vet.sh -install && ./vet.sh

      # gotestsum prints per-test results, a skipped-test report and a pass/skip summary.
      # Prebuilt binary: `go install` of gotestsum needs a newer Go than 1.15/1.16.
      - name: Install gotestsum
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then os=windows; else os=linux; fi
          mkdir -p "$RUNNER_TEMP/gotestsum"
          cd "$RUNNER_TEMP/gotestsum"
          curl -sSfL "https://github.com/gotestyourself/gotestsum/releases/download/v1.12.0/gotestsum_1.12.0_${os}_amd64.tar.gz" | tar -xz
          echo "$RUNNER_TEMP/gotestsum" >> "$GITHUB_PATH"

      # Main tests run for everything except when testing "extras"
      # (where we run a reduced set of tests).
      - name: Run tests
        if: contains(matrix.type, 'tests')
        run: |
          go version
          FILTER="${{ inputs.test-filter }}"
          RUNARGS=()
          if [ -n "$FILTER" ]; then RUNARGS=(-run "${FILTER//,/|}"); fi
          gotestsum --format testname -- ${{ matrix.testflags }} "${RUNARGS[@]}" -cpu 1,4 -timeout ${{ matrix.gotimeout || '7m' }} google.golang.org/grpc/...
          cd "${GITHUB_WORKSPACE}/security/advancedtls" && gotestsum --format testname -- ${{ matrix.testflags }} "${RUNARGS[@]}" -timeout 2m google.golang.org/grpc/security/advancedtls/...
          cd "${GITHUB_WORKSPACE}/security/authorization" && gotestsum --format testname -- ${{ matrix.testflags }} "${RUNARGS[@]}" -timeout 2m google.golang.org/grpc/security/authorization/...


      # Non-core gRPC tests (examples, interop, etc)
      - name: Run extras tests
        if: matrix.type == 'extras' && inputs.test-filter == ''
        run: |
          go version
          examples/examples_test.sh
          security/advancedtls/examples/examples_test.sh
          interop/interop_test.sh
          xds/internal/test/e2e/run.sh
